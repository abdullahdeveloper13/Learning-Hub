components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # Auth
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
        role:
          type: string
          enum: [student, instructor]
          default: student

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # Users
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, instructor, admin]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        password:
          type: string
          minLength: 8

    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [student, instructor, admin]

    UserListResponse:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Categories
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        iconUrl:
          type: ["string", "null"]
        courseCount:
          type: integer

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        iconUrl:
          type: string

    # Courses
    Course:
      type: object
      required: [id, title, slug, instructorId, categoryId, level, isPublished, price, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        shortDescription:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        previewVideoUrl:
          type: ["string", "null"]
        instructorId:
          type: integer
        instructorName:
          type: ["string", "null"]
        instructorAvatar:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        isPublished:
          type: boolean
        price:
          type: number
        discountPrice:
          type: ["number", "null"]
        rating:
          type: ["number", "null"]
        reviewCount:
          type: integer
        enrollmentCount:
          type: integer
        totalLessons:
          type: integer
        totalDuration:
          type: integer
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          properties:
            modules:
              type: array
              items:
                $ref: "#/components/schemas/Module"
            requirements:
              type: array
              items:
                type: string
            outcomes:
              type: array
              items:
                type: string

    CourseInput:
      type: object
      required: [title, categoryId, level, price]
      properties:
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        thumbnailUrl:
          type: string
        previewVideoUrl:
          type: string
        categoryId:
          type: integer
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        price:
          type: number
        discountPrice:
          type: number
        tags:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            type: string
        outcomes:
          type: array
          items:
            type: string

    CourseUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        thumbnailUrl:
          type: string
        previewVideoUrl:
          type: string
        categoryId:
          type: integer
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        price:
          type: number
        discountPrice:
          type: number
        tags:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            type: string
        outcomes:
          type: array
          items:
            type: string

    PublishInput:
      type: object
      required: [isPublished]
      properties:
        isPublished:
          type: boolean

    CourseListResponse:
      type: object
      required: [courses, total, page, limit]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CourseStats:
      type: object
      required: [courseId, totalEnrollments, activeStudents, completionRate, averageRating, totalRevenue]
      properties:
        courseId:
          type: integer
        totalEnrollments:
          type: integer
        activeStudents:
          type: integer
        completionRate:
          type: number
        averageRating:
          type: number
        totalRevenue:
          type: number
        enrollmentsByDay:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentPoint"

    # Modules
    Module:
      type: object
      required: [id, courseId, title, position]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        position:
          type: integer
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"

    ModuleInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        position:
          type: integer

    ModuleUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        position:
          type: integer

    # Lessons
    Lesson:
      type: object
      required: [id, moduleId, title, type, position]
      properties:
        id:
          type: integer
        moduleId:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [video, text, quiz, assignment, resource]
        content:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        resourceUrl:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        position:
          type: integer
        isFree:
          type: boolean
        isCompleted:
          type: boolean

    LessonInput:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [video, text, quiz, assignment, resource]
        content:
          type: string
        videoUrl:
          type: string
        resourceUrl:
          type: string
        duration:
          type: integer
        position:
          type: integer
        isFree:
          type: boolean

    LessonUpdate:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [video, text, quiz, assignment, resource]
        content:
          type: string
        videoUrl:
          type: string
        resourceUrl:
          type: string
        duration:
          type: integer
        position:
          type: integer
        isFree:
          type: boolean

    # Enrollments
    Enrollment:
      type: object
      required: [id, userId, courseId, enrolledAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        courseId:
          type: integer
        course:
          $ref: "#/components/schemas/Course"
        enrolledAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
        progressPercent:
          type: number

    EnrollInput:
      type: object
      required: [courseId]
      properties:
        courseId:
          type: integer

    # Progress
    CourseProgress:
      type: object
      required: [courseId, userId, progressPercent, completedLessons, totalLessons]
      properties:
        courseId:
          type: integer
        userId:
          type: integer
        progressPercent:
          type: number
        completedLessons:
          type: integer
        totalLessons:
          type: integer
        lastLessonId:
          type: ["integer", "null"]
        completedAt:
          type: ["string", "null"]

    LessonProgress:
      type: object
      required: [lessonId, userId, completedAt]
      properties:
        lessonId:
          type: integer
        userId:
          type: integer
        completedAt:
          type: string
          format: date-time

    # Quizzes
    Quiz:
      type: object
      required: [id, courseId, title, questionCount]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        lessonId:
          type: ["integer", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        timeLimit:
          type: ["integer", "null"]
        passingScore:
          type: number
        questionCount:
          type: integer
        attempts:
          type: integer

    QuizDetail:
      allOf:
        - $ref: "#/components/schemas/Quiz"
        - type: object
          properties:
            questions:
              type: array
              items:
                $ref: "#/components/schemas/Question"

    QuizInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        timeLimit:
          type: integer
        passingScore:
          type: number
        lessonId:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionInput"

    QuizUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        timeLimit:
          type: integer
        passingScore:
          type: number

    Question:
      type: object
      required: [id, quizId, text, type, position]
      properties:
        id:
          type: integer
        quizId:
          type: integer
        text:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false, fill_blank]
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        explanation:
          type: ["string", "null"]
        position:
          type: integer
        points:
          type: integer

    QuestionInput:
      type: object
      required: [text, type]
      properties:
        text:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false, fill_blank]
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        correctAnswer:
          type: string
        explanation:
          type: string
        position:
          type: integer
        points:
          type: integer

    QuestionOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean

    QuizSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuizAnswer"

    QuizAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId:
          type: integer
        answer:
          type: string

    QuizResult:
      type: object
      required: [attemptId, score, passed, totalPoints, earnedPoints]
      properties:
        attemptId:
          type: integer
        score:
          type: number
        passed:
          type: boolean
        totalPoints:
          type: integer
        earnedPoints:
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerResult"

    AnswerResult:
      type: object
      required: [questionId, isCorrect, earnedPoints]
      properties:
        questionId:
          type: integer
        isCorrect:
          type: boolean
        earnedPoints:
          type: integer
        explanation:
          type: ["string", "null"]

    QuizAttempt:
      type: object
      required: [id, quizId, userId, score, passed, createdAt]
      properties:
        id:
          type: integer
        quizId:
          type: integer
        userId:
          type: integer
        score:
          type: number
        passed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LeaderboardEntry:
      type: object
      required: [rank, userId, userName, score, completedAt]
      properties:
        rank:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userAvatar:
          type: ["string", "null"]
        score:
          type: number
        completedAt:
          type: string
          format: date-time

    # Assignments
    Assignment:
      type: object
      required: [id, courseId, title, dueDate]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        lessonId:
          type: ["integer", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        dueDate:
          type: string
          format: date-time
        maxScore:
          type: integer
        submissionType:
          type: string
          enum: [text, file, link]

    AssignmentInput:
      type: object
      required: [title, dueDate]
      properties:
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
